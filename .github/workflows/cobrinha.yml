name: Generate Datas

on:
  schedule: # execute every 12 hours, at minute 0
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Snake Animation — themed to match the profile's neon blue/purple/cyan/pink palette
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: Dannii99
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=F1EEFB&color_dots=1C1B33,3D8BFF,9D4EFF,2EE6D6,FF4FD8
            dist/github-contribution-grid-snake-light.svg?color_snake=120F26&color_dots=E3E0F5,3D8BFF,9D4EFF,2EE6D6,FF4FD8

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
